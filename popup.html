<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Anti Instagram Login</title>
</head>
<body>
  <header class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Anti Instagram Login</h1>
      <span class="version" id="version">v—</span>
    </div>
    <label class="switch" title="Master on/off">
      <input type="checkbox" id="enabledToggle">
      <span class="slider"></span>
    </label>
  </header>

  <div class="status" id="statusCard">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Active</span>
  </div>

  <section class="section" id="featuresSection">
    <h2>Features</h2>

    <div class="setting">
      <div class="setting-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <div class="setting-text">
        <span class="setting-title">Download button</span>
        <span class="setting-desc">Floating button on posts &amp; reels</span>
      </div>
      <label class="switch small">
        <input type="checkbox" id="downloadBtnToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting">
      <div class="setting-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <div class="setting-text">
        <span class="setting-title">Exact timestamps</span>
        <span class="setting-desc">"~2.4y" ages + full dates on posts</span>
      </div>
      <label class="switch small">
        <input type="checkbox" id="timestampsToggle">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <section class="section stats">
    <div class="stat">
      <span class="stat-value" id="blockedCount">0</span>
      <span class="stat-label">Login walls removed</span>
    </div>
    <button id="resetBtn" class="icon-btn" title="Reset counter">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
  </section>

  <footer class="footer">
    <a href="https://github.com/anti-js/anti-instagram-js" target="_blank">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      anti-js/anti-instagram-js
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
